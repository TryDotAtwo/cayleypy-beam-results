name: promote-ingest

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_call:
    inputs:
      trigger_head:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      force_verify:
        description: Revalidate and rebuild even when the service tag matches main
        type: boolean
        default: false

permissions: {}

jobs:
  promote:
    if: >-
      github.repository == 'TryDotAtwo/cayleypy-beam-results' &&
      vars.ENABLE_CAYLEYPY_AUTO_MERGE == 'true'
    permissions:
      checks: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main
      # actions/setup-python v5.4.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - env:
          BASE_BRANCH: main
          EXPECTED_APP_LOGIN: ${{ vars.RESULTS_INGEST_APP_LOGIN }}
          EXPECTED_BOT_ID: ${{ vars.RESULTS_INGEST_BOT_ID }}
          EXPECTED_REPOSITORY: TryDotAtwo/cayleypy-beam-results
          GH_TOKEN: ${{ github.token }}
          SENDER_ID: ${{ github.event.sender.id }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          STAGING_BRANCH: ingest/staging
          TRIGGER_HEAD: ${{ inputs.trigger_head }}
          FORCE_VERIFY: ${{ inputs.force_verify }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test -n "$EXPECTED_APP_LOGIN"
          test -n "$EXPECTED_BOT_ID"
          case "$EXPECTED_BOT_ID" in
            *[!0-9]*) exit 1 ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_ACTOR" = "$EXPECTED_APP_LOGIN"
            test "$SENDER_TYPE" = "Bot"
            test "$SENDER_ID" = "$EXPECTED_BOT_ID"
            test -n "$TRIGGER_HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] || \
               [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER_HEAD=""
          else
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          retry_delay() {
            sleep "$((attempt < 5 ? attempt : 5))"
          }

          for attempt in $(seq 1 40); do
            git fetch --no-tags origin \
              "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" \
              "+refs/tags/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
            base="$(git rev-parse "origin/$BASE_BRANCH")"
            latest="$(git rev-parse "origin/$STAGING_BRANCH")"
            if [ -n "$TRIGGER_HEAD" ]; then
              git rev-parse --verify --quiet "$TRIGGER_HEAD^{commit}" >/dev/null
              git merge-base --is-ancestor "$TRIGGER_HEAD" "$latest"
            fi

            if git merge-base --is-ancestor "$latest" "$base" && [ "$FORCE_VERIFY" != "true" ]; then
              if [ "$latest" != "$base" ]; then
                git push \
                  --force-with-lease="refs/tags/$STAGING_BRANCH:$latest" \
                  origin "$base:refs/tags/$STAGING_BRANCH"
              fi
              exit 0
            fi

            common="$(git merge-base "$base" "$latest")"
            python tools/validate_result.py \
              --base "$common" \
              --head "$latest" \
              --allow-generated-indexes

            git checkout --detach "$latest"
            if ! git merge-base --is-ancestor "$base" "$latest"; then
              git merge --no-edit "$base"
            fi
            python tools/validate_result.py \
              --base "$base" \
              --head HEAD \
              --allow-generated-indexes
            python tools/build_indexes.py \
              --results results \
              --native-results data/v2/slurm \
              --out data
            git add -- data

            while IFS= read -r changed; do
              case "$changed" in
                data/README.md|data/*/README.md|data/index.tsv|data/by_author.tsv|\
                data/best_solutions.tsv|data/runs.json|\
                data/.human-results-manifest.json|\
                data/*/index.tsv|data/*/puzzles/p*/solutions.tsv|\
                data/*/puzzles/p*/best_solution.tsv|\
                data/*/puzzles/p*/metadata.json|\
                data/*/puzzles/p*/summary.md) ;;
                *) exit 1 ;;
              esac
            done < <(git diff --cached --name-only)
            if ! git diff --cached --quiet; then
              git commit -m "chore: rebuild CayleyPy result indexes"
            fi
            candidate="$(git rev-parse HEAD)"

            if [ "$candidate" != "$latest" ]; then
              if ! git push --force-with-lease="refs/tags/$STAGING_BRANCH:$latest" \
                origin "HEAD:refs/tags/$STAGING_BRANCH"; then
                retry_delay
                continue
              fi
            fi

            git fetch --no-tags origin \
              "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" \
              "+refs/tags/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
            base="$(git rev-parse "origin/$BASE_BRANCH")"
            remote_head="$(git rev-parse "origin/$STAGING_BRANCH")"
            if [ "$remote_head" != "$candidate" ] || \
               ! git merge-base --is-ancestor "$base" "$candidate"; then
              retry_delay
              continue
            fi

            git checkout --detach "$candidate"
            python tools/validate_result.py \
              --base "$base" \
              --head "$candidate" \
              --allow-generated-indexes

            generated="$(mktemp -d)"
            trap 'rm -rf -- "$generated"' EXIT
            python tools/build_indexes.py \
              --results results \
              --native-results data/v2/slurm \
              --out "$generated"
            python - "$generated" <<'PY'
          import json
          from pathlib import Path
          import sys

          generated = Path(sys.argv[1])
          payload = json.loads(
              (generated / ".human-results-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          fixed = (
              "index.tsv",
              "by_author.tsv",
              "best_solutions.tsv",
              "runs.json",
              ".human-results-manifest.json",
          )
          for relative in (*fixed, *payload["paths"]):
              if (Path("data") / relative).read_bytes() != (
                  generated / relative
              ).read_bytes():
                  raise SystemExit(f"generated payload mismatch: {relative}")
          PY
            rm -rf -- "$generated"
            trap - EXIT

            check_id="$(
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/check-runs" \
                --input - \
                --jq '.id' <<JSON
          {"name":"cayleypy-results/exact-candidate","head_sha":"$candidate","status":"completed","conclusion":"success","output":{"title":"Exact indexed candidate validated","summary":"Schema, canonical hashes, replay, append-only paths, and deterministic indexes passed."}}
          JSON
            )"
            case "$check_id" in
              ""|*[!0-9]*) exit 1 ;;
            esac

            git fetch --no-tags origin \
              "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" \
              "+refs/tags/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH"
            base="$(git rev-parse "origin/$BASE_BRANCH")"
            remote_head="$(git rev-parse "origin/$STAGING_BRANCH")"
            if [ "$remote_head" != "$candidate" ] || \
               ! git merge-base --is-ancestor "$base" "$candidate"; then
              retry_delay
              continue
            fi
            if git diff --quiet "$base" "$candidate" --; then
              exit 0
            fi

            # Main advances only after the exact candidate check above.
            # The ancestry guard makes this a fast-forward; the lease rejects races.
            if git push --force-with-lease="refs/heads/$BASE_BRANCH:$base" \
              origin "$candidate:refs/heads/$BASE_BRANCH"; then
              git fetch --no-tags origin \
                "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
              published="$(git rev-parse "origin/$BASE_BRANCH")"
              git merge-base --is-ancestor "$candidate" "$published"
              git push --force-with-lease="refs/tags/$STAGING_BRANCH:$candidate" \
                origin "$published:refs/tags/$STAGING_BRANCH" || true
              exit 0
            fi
            retry_delay
          done
          echo "Promotion retries exhausted" >&2
          exit 1
